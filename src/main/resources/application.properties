spring.application.name=job-recruitment-platform
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000
app.admin.email=${JOBPLATFORM_ADMIN_EMAIL:}
app.admin.password=${JOBPLATFORM_ADMIN_PASSWORD:}
app.seed-samples=false
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:8080}

spring.profiles.default=local
server.port=${PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
server.compression.enabled=true
server.compression.min-response-size=1KB
server.tomcat.threads.max=${HTTP_MAX_THREADS:50}
server.tomcat.threads.min-spare=${HTTP_MIN_SPARE_THREADS:10}
server.tomcat.max-connections=${HTTP_MAX_CONNECTIONS:200}
server.tomcat.accept-count=${HTTP_ACCEPT_COUNT:100}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.flyway.enabled=true
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.validation-timeout=1000
spring.datasource.hikari.keepalive-time=300000
spring.datasource.hikari.max-lifetime=1740000

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.info.env.enabled=false
