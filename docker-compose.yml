services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: jobplatform
      POSTGRES_USER: ${DB_USERNAME:?Set DB_USERNAME in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://db:5432/jobplatform
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_POOL_MIN_IDLE: ${DB_POOL_MIN_IDLE:-2}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JOBPLATFORM_ADMIN_EMAIL: ${JOBPLATFORM_ADMIN_EMAIL:-}
      JOBPLATFORM_ADMIN_PASSWORD: ${JOBPLATFORM_ADMIN_PASSWORD:-}
    ports:
      - "127.0.0.1:${PORT:-8080}:8080"

volumes:
  postgres-data:
